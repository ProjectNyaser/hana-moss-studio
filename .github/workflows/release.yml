name: Release

# 触发：push tag v*（发版）/ workflow_dispatch（手动，只出 artifact 不建 release）
#
# 两段式：
#   build：出包（ZIP + .entry.json），校验 tag 与 manifest 版本一致。
#   publish：把两个文件挂到正式 Release 上，发完回头核对不是 draft、不是 prerelease。
#
# 打包是仓库自己的事（scripts/pack.mjs）：包内容由这个 App 需要什么决定，
# 条目的 sha256 对包现算，不经中间小票。
#
# App 的 SDK 副本（app/sdk）与 vendor-bin 下的两个 exe 都不入库，
# 由 pnpm run pack 在构建机上现展、现取、现编。
#
# 不做平台矩阵：交付物是纯 JS，一个包跑遍所有平台，矩阵只是白花时间。
# 但构建机必须是 Windows：包里带两个外部可执行文件，aria2c.exe 从 Release 取，
# shm-bridge.exe 用 .NET Framework 的 csc.exe 编译（scripts/vendor/shm-bridge.mjs
# 在非 win32 上直接 exit 1）。在 Linux runner 上出包会缺这两个文件。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  HANA_TOOLS_REPO: liliMozi/openhanako
  HANA_TOOLS_REF: main

jobs:
  build:
    runs-on: windows-2022
    # 出包要下 aria2c、编 shm-bridge、展 SDK，正常在十分钟内；
    # 卡住时不该占着 runner 六个小时。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # App 的 SDK 副本不入库（见 .gitignore），从 vendor/hana-app-sdk 的快照展开；
      # vendor-bin 下的两个 exe 也不入库，由 pack 前的两步现取 / 现编译。
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      # pack 脚本的链条：取 aria2c → 编译 shm-bridge → 展开 SDK → 出 ZIP 与条目。
      # 不能只跑 derive + pack，那样包里没有 aria2c.exe 与 shm-bridge.exe。
      - name: 出包
        run: pnpm run pack

      # tag 是 v0.1.0 而 manifest 写着别的版本，发出去的包装着错版本号。
      - name: 校验 tag 与 manifest 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $manifest = node -p "JSON.parse(require('fs').readFileSync('app/manifest.json','utf8')).version"
          Write-Host "tag = $tag / manifest = $manifest"
          if ($tag -ne $manifest) {
            Write-Error "tag $tag 与 manifest 版本 $manifest 不一致"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hana-moss-studio-dist
          path: dist-extensions/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hana-moss-studio-dist
          path: dist-extensions

      # 市场要求 Release 不能是草稿、也不能是 prerelease，所以这里建正式 release。
      # latest 标记留给人工决定，不让流水线把刚出来的版本推成默认。
      - name: 建 Release 并传包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          FILES=(dist-extensions/*.zip dist-extensions/*.entry.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::没有找到 zip 或 entry.json，无法发布"
            exit 1
          fi
          printf '待上传：%s\n' "${FILES[@]}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG 已存在，改为追加上传"
            gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: 核对发布结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          INFO=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets)
          echo "$INFO"
          echo "$INFO" | node -e '
            let s = "";
            process.stdin.on("data", (c) => (s += c)).on("end", () => {
              const r = JSON.parse(s);
              if (r.isDraft) { console.error("::error::release 仍是 draft"); process.exit(1); }
              if (r.isPrerelease) { console.error("::error::release 是 prerelease，市场不接受"); process.exit(1); }
              const names = (r.assets || []).map((a) => a.name);
              if (!names.some((n) => n.endsWith(".zip"))) { console.error("::error::release 里没有 zip"); process.exit(1); }
              if (!names.some((n) => n.endsWith(".entry.json"))) { console.error("::error::release 里没有 entry.json"); process.exit(1); }
              console.log("发布确认：资产 " + names.length + " 个 → " + names.join("、"));
            });
          '
