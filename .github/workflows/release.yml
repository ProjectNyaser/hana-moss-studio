name: Release

# 触发：push tag v*（发版）/ workflow_dispatch（手动，只出 artifact 不建 release）
#
# 两段式：
#   build：出包（ZIP + .entry.json），校验 tag 与 manifest 版本一致。
#   publish：把两个文件挂到正式 Release 上，发完回头核对不是 draft、不是 prerelease。
#
# 打包是仓库自己的事（scripts/pack.mjs）：包内容由这个 App 需要什么决定，
# 条目的 sha256 对包现算，不经中间小票。
#
# App 的 SDK 副本（app/sdk）不入库，是 vendor/hana-app-sdk 里 tgz 的派生物，
# 构建前先 pnpm install + derive 把它展出来。
#
# 不做平台矩阵：交付物是纯 JS，一个包跑遍所有平台，矩阵只是白花时间。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  HANA_TOOLS_REPO: liliMozi/openhanako
  HANA_TOOLS_REF: main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # App 的 SDK 副本不入库（见 .gitignore），从 vendor/hana-app-sdk 的快照展开，
      # 所以构建前必须装依赖。tgz 在仓库里，这一步不需要联网取 SDK。
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: 装依赖并展开 SDK 副本
        run: |
          pnpm install --frozen-lockfile
          pnpm run derive

      - name: 出包
        run: node scripts/pack.mjs

      # tag 是 v0.1.0 而 manifest 写着别的版本，发出去的包装着错版本号。
      - name: 校验 tag 与 manifest 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "JSON.parse(require('fs').readFileSync('app/manifest.json','utf8')).version")
          echo "tag = $TAG / manifest = $MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag $TAG 与 manifest 版本 $MANIFEST 不一致"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hana-moss-studio-dist
          path: dist-extensions/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hana-moss-studio-dist
          path: dist-extensions

      # 市场要求 Release 不能是草稿、也不能是 prerelease，所以这里建正式 release。
      # latest 标记留给人工决定，不让流水线把刚出来的版本推成默认。
      - name: 建 Release 并传包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          FILES=(dist-extensions/*.zip dist-extensions/*.entry.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::没有找到 zip 或 entry.json，无法发布"
            exit 1
          fi
          printf '待上传：%s\n' "${FILES[@]}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG 已存在，改为追加上传"
            gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: 核对发布结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          INFO=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets)
          echo "$INFO"
          echo "$INFO" | node -e '
            let s = "";
            process.stdin.on("data", (c) => (s += c)).on("end", () => {
              const r = JSON.parse(s);
              if (r.isDraft) { console.error("::error::release 仍是 draft"); process.exit(1); }
              if (r.isPrerelease) { console.error("::error::release 是 prerelease，市场不接受"); process.exit(1); }
              const names = (r.assets || []).map((a) => a.name);
              if (!names.some((n) => n.endsWith(".zip"))) { console.error("::error::release 里没有 zip"); process.exit(1); }
              if (!names.some((n) => n.endsWith(".entry.json"))) { console.error("::error::release 里没有 entry.json"); process.exit(1); }
              console.log("发布确认：资产 " + names.length + " 个 → " + names.join("、"));
            });
          '
