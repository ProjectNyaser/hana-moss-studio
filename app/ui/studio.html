<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>苔室</title>
  <script src="./assets/theme-boot.js"></script>
  <link rel="stylesheet" href="./assets/hana-theme.css">
  <link rel="stylesheet" href="./assets/studio.css">
</head>
<body>
  <main class="canvas-column">
    <div class="canvas-bar">
      <span class="chip" id="stage-chip"><span class="dot" id="stage-dot"></span><span id="stage-text">读取状态…</span></span>
      <span class="canvas-meta mono" id="canvas-meta"></span>
      <span class="spacer"></span>
      <button class="btn ghost small" id="clear-jobs" type="button">清理记录</button>
    </div>

    <div class="canvas" id="canvas">
      <figure class="result" id="result" hidden>
        <img id="result-image" alt="最近一次出图">
        <figcaption id="result-caption"></figcaption>
      </figure>
      <div class="canvas-empty" id="canvas-empty">
        <p class="canvas-empty-title">画布还空着</p>
        <p class="hint">在左侧栏写下提示词，按「开始生成」。出图会落在这里，旧图收进画廊。</p>
      </div>
    </div>

    <div class="progress-band" id="progress-band" hidden>
      <span class="band-label" id="band-label">准备中</span>
      <div class="bar" id="band-bar"><i></i></div>
      <span class="band-eta mono" id="band-eta"></span>
    </div>

    <details class="gallery" id="gallery" open>
      <summary class="gallery-head">
        <span class="gallery-title">
          <span class="caret" aria-hidden="true"></span>
          <span class="section-title">画廊</span>
        </span>
        <span class="hint" id="gallery-count"></span>
      </summary>
      <div class="thumbs" id="thumbs"></div>
    </details>
  </main>

  <div class="lightbox" id="lightbox" hidden><img id="lightbox-image" alt=""></div>

  <script type="module" src="./assets/studio.js"></script>
</body>
</html>
