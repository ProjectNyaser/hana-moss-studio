<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>苔室</title>
  <script src="./assets/theme-boot.js"></script>
  <link rel="stylesheet" href="./assets/hana-theme.css">
  <link rel="stylesheet" href="./assets/studio.css">
</head>
<body>
  <main class="studio-column">
    <nav class="studio-tabs" id="studio-tabs" role="tablist">
      <button class="studio-tab on" type="button" role="tab" data-view="canvas">画布</button>
      <button class="studio-tab" type="button" role="tab" data-view="gallery">画廊<span class="tab-count" id="tab-count"></span></button>
      <button class="studio-tab" type="button" role="tab" data-view="queue">队列<span class="tab-count" id="tab-queue"></span></button>
      <button class="studio-tab" type="button" role="tab" data-view="versions">版本</button>
      <span class="spacer"></span>
      <span class="chip" id="stage-chip"><span class="dot" id="stage-dot"></span><span id="stage-text">读取状态…</span></span>
      <button class="chip chip-action" id="stage-cancel" type="button" hidden>取消</button>
      <span class="canvas-meta mono" id="canvas-meta"></span>
    </nav>
    <div class="top-progress" id="top-progress" hidden><i id="top-progress-bar"></i></div>

    <section class="studio-view" id="view-canvas">
      <div class="canvas" id="canvas">
        <figure class="result" id="result" hidden>
          <img id="result-image" alt="最近一次出图">
          <figcaption id="result-caption"></figcaption>
        </figure>
        <div class="canvas-empty" id="canvas-empty">
          <p class="canvas-empty-title">画布还空着</p>
          <p class="hint">在左侧栏写下提示词，按「开始生成」。出图会落在这里，旧图收进「画廊」。</p>
        </div>
      </div>
    </section>

    <section class="studio-view" id="view-gallery" hidden>
      <div class="view-bar">
        <span class="section-title">画廊</span>
        <span class="hint" id="gallery-count"></span>
        <span class="spacer"></span>
      </div>
      <div class="thumbs gallery-grid" id="thumbs"></div>
    </section>

    <section class="studio-view" id="view-queue" hidden>
      <div class="manage-scroll">
        <section class="manage-block">
          <header class="manage-head">
            <h2>队列</h2>
            <span class="hint" id="queue-count"></span>
          </header>
          <div class="queue-cards" id="queue-list"></div>
        </section>
      </div>
    </section>

    <section class="studio-view" id="view-versions" hidden>
      <div class="manage-scroll">
        <div class="split">
          <nav class="split-tabs" id="versions-tabs">
            <button class="split-tab on" type="button" data-pane="engine">引擎</button>
            <button class="split-tab" type="button" data-pane="model">模型</button>
            <button class="split-tab" type="button" data-pane="host">这台机器</button>
          </nav>
          <div class="split-body">
            <section class="split-pane" data-pane="engine">
              <header class="manage-head">
                <h2>引擎</h2>
                <span class="hint" id="versions-engine-state"></span>
                <span class="spacer"></span>
                <button class="btn small" id="versions-engine-toggle" type="button">启动引擎</button>
              </header>
              <p class="hint" id="versions-engine-note"></p>
              <div class="manage-list" id="versions-installed"></div>

              <header class="manage-head sub">
                <h2>可安装</h2>
                <span class="hint" id="download-available-state"></span>
                <span class="spacer"></span>
                <button class="btn small" id="download-engine" type="button">安装最新</button>
              </header>
              <div class="manage-list" id="download-available"></div>
            </section>

            <section class="split-pane" data-pane="model" hidden>
              <header class="manage-head">
                <h2>模型</h2>
                <span class="hint" id="versions-model-state"></span>
                <span class="spacer"></span>
                <button class="btn ghost small" id="versions-remove-model" type="button">卸载当前模型</button>
              </header>
              <div class="manage-list" id="versions-model"></div>

              <header class="manage-head sub">
                <h2>全部仓库</h2>
                <span class="hint">都可以再校验一遍</span>
              </header>
              <div class="manage-list" id="download-models"></div>
            </section>

            <section class="split-pane" data-pane="host" hidden>
              <header class="manage-head">
                <h2>这台机器</h2>
              </header>
              <div class="manage-list" id="versions-host"></div>
            </section>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-top">
      <span class="viewer-index mono" id="viewer-index"></span>
      <span class="spacer"></span>
      <button class="viewer-btn" id="viewer-zoom-out" type="button" title="缩小（-）">−</button>
      <button class="viewer-btn" id="viewer-zoom-fit" type="button" title="适应窗口（0）">适应</button>
      <button class="viewer-btn" id="viewer-zoom-actual" type="button" title="原始大小（1）">1:1</button>
      <button class="viewer-btn" id="viewer-zoom-in" type="button" title="放大（+）">+</button>
      <button class="viewer-btn" id="viewer-close" type="button" title="关闭（Esc）">×</button>
    </div>

    <button class="viewer-nav prev" id="viewer-prev" type="button" title="上一张（←）">‹</button>
    <button class="viewer-nav next" id="viewer-next" type="button" title="下一张（→）">›</button>

    <div class="viewer-stage" id="viewer-stage">
      <img id="viewer-image" alt="">
    </div>

    <div class="viewer-info" id="viewer-info"></div>
  </div>
  <div class="ctx-menu" id="ctx-menu" hidden role="menu"></div>
  <div class="toast" id="toast" hidden role="status"></div>

  <script type="module" src="./assets/studio.js"></script>
</body>
</html>
