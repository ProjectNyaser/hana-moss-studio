<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>苔室</title>
  <script src="./assets/theme-boot.js"></script>
  <link rel="stylesheet" href="./assets/hana-theme.css">
  <link rel="stylesheet" href="./assets/studio.css?v=2026111622">
</head>
<body>
  <main class="studio-column">
    <nav class="studio-tabs" id="studio-tabs" role="tablist">
      <button class="studio-tab on" type="button" role="tab" data-view="chat">会话</button>
      <button class="studio-tab" type="button" role="tab" data-view="canvas">画布</button>
      <button class="studio-tab" type="button" role="tab" data-view="gallery">画廊<span class="tab-count" id="tab-count"></span></button>
      <button class="studio-tab" type="button" role="tab" data-view="queue">队列<span class="tab-count" id="tab-queue"></span></button>
      <button class="studio-tab" type="button" role="tab" data-view="versions">版本</button>
      <span class="spacer"></span>
      <span class="chip" id="stage-chip"><span class="dot" id="stage-dot"></span><span id="stage-text">读取状态…</span></span>
      <button class="chip chip-action" id="stage-cancel" type="button" hidden>取消</button>
      <span class="canvas-meta mono" id="canvas-meta"></span>
    </nav>
    <div class="top-progress" id="top-progress" hidden><i id="top-progress-bar"></i></div>

    <section class="studio-view" id="view-chat">
      <div class="chat-log" id="chat-log"></div>
    </section>

    <section class="studio-view" id="view-canvas" hidden>
      <div class="canvas" id="canvas">
        <figure class="result" id="result" hidden>
          <div class="result-shot">
            <img id="result-image" alt="最近一次出图">
            <div class="result-bar" id="result-bar">
              <button class="rb" type="button" data-act="base" title="当作图生图的底图（init image）">当底图</button>
              <button class="rb" type="button" data-act="ref" title="喂给编辑适配器当参考图">当参考图</button>
              <button class="rb" type="button" data-act="reuse" title="把这组参数送回侧栏">载入参数</button>
              <button class="rb" type="button" data-act="view" title="全屏查看（←/→ 翻页）">全屏</button>
              <button class="rb" type="button" data-act="save" title="另存一张到本地">另存</button>
              <button class="rb danger" type="button" data-act="delete" title="删掉这张，连同它的记录">删除</button>
            </div>
          </div>
          <figcaption id="result-caption"></figcaption>
        </figure>
        <div class="canvas-empty" id="canvas-empty">
          <p class="canvas-empty-title">画布还空着</p>
          <p class="hint canvas-empty-sub">拖到画布当底图，拖到输入框当参考图</p>
        </div>

        <div class="lay" id="lay" hidden>
          <div class="lay-bar">
            <span class="lay-info" id="lay-info"></span>
            <span class="spacer"></span>
            <button class="btn small" id="lay-base" type="button" title="回到改图台，在同一张底图上抹蒙版">抹蒙版</button>
            <button class="btn small" id="lay-import" type="button">换底图</button>
            <button class="btn small" id="lay-clear" type="button">清空框</button>
            <button class="btn small" id="lay-close" type="button">关闭</button>
          </div>
          <div class="lay-stage" id="lay-stage">
            <div class="lay-sheet" id="lay-sheet" tabindex="-1">
              <div class="lay-grid"></div>
              <div class="lay-boxes" id="lay-boxes"></div>
              <div class="lay-draft" id="lay-draft" hidden></div>
            </div>
          </div>
          <div class="lay-form" id="lay-form" hidden>
            <label class="field lay-field lay-field-label"><span class="label">类型</span><input id="lay-label" type="text" list="lay-label-list" placeholder="object" spellcheck="false"></label>
            <label class="field lay-field lay-field-caption"><span class="label">这块的提示词</span><textarea id="lay-caption" rows="2" placeholder="顶部居中的大标题，白色粗体，压在蓝山上"></textarea></label>
            <label class="field lay-field lay-field-text"><span class="label">要渲染的字</span><input id="lay-text" type="text" placeholder="类型选 text 时填" spellcheck="false"></label>
            <span class="lay-size" id="lay-size"></span>
            <button class="btn small" id="lay-remove" type="button">删除</button>
          </div>
          <datalist id="lay-label-list">
            <option value="object"></option>
            <option value="text"></option>
            <option value="icon"></option>
            <option value="scene"></option>
            <option value="person"></option>
          </datalist>
        </div>
        <div class="base" id="base" hidden>
          <div class="base-bar">
            <span class="base-info" id="base-info"></span>
            <span class="spacer"></span>
            <label class="base-brush" id="base-brush-field" hidden><span>笔刷</span>
              <input id="base-brush" type="range" min="6" max="240" step="2" value="60">
              <span class="base-brush-value mono" id="base-brush-value">60</span></label>
            <button class="btn small" id="base-paint" type="button">画蒙版</button>
            <button class="btn small" id="base-erase" type="button" hidden>擦</button>
            <button class="btn small" id="base-mask-clear" type="button" hidden>清空</button>
            <button class="btn small" id="base-mask-save" type="button" hidden>保存蒙版</button>
            <button class="btn small" id="base-layout" type="button" title="把这张底图交给布局框选">框选布局</button>
            <button class="btn small" id="base-close" type="button">关闭</button>
          </div>
          <div class="base-stage" id="base-stage">
            <div class="base-frame" id="base-frame">
              <img id="base-image" alt="底图">
              <canvas id="base-mask"></canvas>
            </div>
          </div>
        </div>
        <div class="canvas-drop-hint" id="canvas-drop-hint" hidden>松手：这张当底图改</div>
        <input type="file" id="lay-file" accept="image/*" hidden>
      </div>

      <div class="composer" id="composer">
        <div class="composer-chips" id="composer-chips" hidden></div>
        <div class="composer-extra" id="composer-extra" hidden>
          <input id="composer-negative" type="text" placeholder="反向提示词（可选）">
          <input id="composer-seed" type="number" min="0" placeholder="种子">
        </div>
        <textarea id="composer-input" rows="1" placeholder="描述画面，或者把图拖进来改"></textarea>
        <div class="composer-tools">
          <button class="cbtn cbtn-plus" id="composer-plus" type="button" title="加图">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M8 3.4v9.2M3.4 8h9.2"/>
            </svg>
          </button>
          <div class="cmenu" id="cmenu" hidden>
            <p class="cmenu-group">添加</p>
            <button class="cmenu-item" type="button" data-act="base">
              <span class="cmenu-title">底图</span>
              <span class="cmenu-note">当起点：抹一块改，或者框几块重排</span>
            </button>
            <button class="cmenu-item" type="button" data-act="reference">
              <span class="cmenu-title">参考图</span>
              <span class="cmenu-note">交给编辑适配器，照着这张改</span>
            </button>
            <p class="cmenu-group">可选</p>
            <button class="cmenu-item" type="button" data-act="negative">
              <span class="cmenu-title">反向提示词</span>
              <span class="cmenu-note">不要什么</span>
            </button>
            <button class="cmenu-item" type="button" data-act="seed">
              <span class="cmenu-title">种子</span>
              <span class="cmenu-note">留空随机</span>
            </button>
          </div>
          <button class="cbtn" id="composer-params" type="button" title="尺寸、步数、CFG">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 5h11M2.5 11h11"/>
              <circle cx="6" cy="5" r="1.7"/>
              <circle cx="10.4" cy="11" r="1.7"/>
            </svg>
          </button>
          <button class="cbtn" id="composer-sample" type="button" title="采样器与调度器">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.2 8.6h2.1l1.3-3.4 2.1 6.2 1.5-4 1.2 1.2h3.4"/>
            </svg>
          </button>
          <span class="spacer"></span>
          <button class="model-chip" id="composer-model" type="button" title="模型与精度档"></button>
          <div class="cpop" id="cpop" hidden>
            <div class="cpop-head">
              <button class="cpop-back" id="cpop-back" type="button" title="返回" hidden>‹</button>
              <span class="cpop-title" id="cpop-title"></span>
            </div>
            <div class="cpop-body" id="cpop-body"></div>
          </div>
          <div class="cpop cpop-left" id="ppop" hidden>
            <div class="cpop-head">
              <button class="cpop-back" id="ppop-back" type="button" title="返回" hidden>‹</button>
              <span class="cpop-title" id="ppop-title"></span>
            </div>
            <div class="cpop-body" id="ppop-body"></div>
          </div>
          <div class="cpop cpop-left" id="spop" hidden>
            <div class="cpop-head">
              <button class="cpop-back" id="spop-back" type="button" title="返回" hidden>‹</button>
              <span class="cpop-title" id="spop-title"></span>
            </div>
            <div class="cpop-body" id="spop-body"></div>
          </div>
          <button class="send" id="composer-send" type="button" title="生成"></button>
        </div>
        <input type="file" id="composer-ref-file" accept="image/*" hidden>
      </div>
    </section>

    <section class="studio-view" id="view-gallery" hidden>
      <div class="view-bar">
        <span class="section-title">画廊</span>
        <span class="hint" id="gallery-count"></span>
        <span class="spacer"></span>
      </div>
      <div class="thumbs gallery-grid" id="thumbs"></div>
    </section>

    <section class="studio-view" id="view-queue" hidden>
      <div class="manage-scroll">
        <section class="manage-block">
          <header class="manage-head">
            <h2>队列</h2>
            <span class="hint" id="queue-count"></span>
          </header>
          <div class="queue-cards" id="queue-list"></div>
        </section>
      </div>
    </section>

    <section class="studio-view" id="view-versions" hidden>
      <div class="manage-scroll">
        <div class="split">
          <nav class="split-tabs" id="versions-tabs">
            <button class="split-tab on" type="button" data-pane="engine">引擎</button>
            <button class="split-tab" type="button" data-pane="model">模型</button>
            <button class="split-tab" type="button" data-pane="host">这台机器</button>
          </nav>
          <div class="split-body">
            <section class="split-pane" data-pane="engine">
              <header class="manage-head">
                <h2>引擎</h2>
                <span class="hint" id="versions-engine-state"></span>
                <span class="spacer"></span>
                <button class="btn small" id="versions-engine-toggle" type="button">启动引擎</button>
                <button class="btn small" id="versions-engine-release" type="button" hidden
                        title="把显存还给显卡，引擎留着：下次出图自动重新加载">释放显存</button>
              </header>
              <p class="hint" id="versions-engine-note"></p>
              <div class="manage-list" id="versions-installed"></div>

              <header class="manage-head sub">
                <h2>可安装</h2>
                <span class="hint" id="download-available-state"></span>
                <span class="spacer"></span>
                <button class="btn small" id="download-engine" type="button">安装最新</button>
              </header>
              <div class="manage-list" id="download-available"></div>
            </section>

            <section class="split-pane" data-pane="model" hidden>
              <div class="manage-list" id="config-list"></div>

              <header class="manage-head sub">
                <h2>完整模型包（可选）</h2>
                <span class="hint" id="versions-model-state"></span>
              </header>
              <div class="manage-list" id="versions-model"></div>

              <header class="manage-head sub">
                <h2>单文件适配器</h2>
                <span class="hint" id="files-adapter-state"></span>
              </header>
              <div class="manage-list" id="download-adapters"></div>

              <header class="manage-head sub">
                <h2>单文件 DiT</h2>
                <span class="hint" id="files-dit-state"></span>
              </header>
              <div class="manage-list" id="download-dits"></div>

              <header class="manage-head sub">
                <h2>文本编码器</h2>
                <span class="hint" id="files-encoder-state"></span>
              </header>
              <div class="manage-list" id="download-encoders"></div>
            </section>

            <section class="split-pane" data-pane="host" hidden>
              <header class="manage-head">
                <h2>这台机器</h2>
              </header>
              <div class="manage-list" id="versions-host"></div>
            </section>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="refbox" id="refbox" hidden>
    <img id="refbox-img" alt="参考图">
    <button class="refbox-close" id="refbox-close" type="button" title="关闭">×</button>
  </div>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-top">
      <span class="viewer-index mono" id="viewer-index"></span>
      <button class="viewer-btn" id="viewer-edit" type="button" title="当底图，去画布抹一块重画">改这张</button>
      <button class="viewer-btn" id="viewer-ref" type="button" title="当编辑适配器的参考图">当参考图</button>
      <span class="spacer"></span>
      <button class="viewer-btn" id="viewer-zoom-out" type="button" title="缩小（-）">−</button>
      <button class="viewer-btn" id="viewer-zoom-fit" type="button" title="适应窗口（0）">适应</button>
      <button class="viewer-btn" id="viewer-zoom-actual" type="button" title="原始大小（1）">1:1</button>
      <button class="viewer-btn" id="viewer-zoom-in" type="button" title="放大（+）">+</button>
      <button class="viewer-btn" id="viewer-close" type="button" title="关闭（Esc）">×</button>
    </div>

    <button class="viewer-nav prev" id="viewer-prev" type="button" title="上一张（←）">‹</button>
    <button class="viewer-nav next" id="viewer-next" type="button" title="下一张（→）">›</button>

    <div class="viewer-stage" id="viewer-stage">
      <img id="viewer-image" alt="">
    </div>

    <div class="viewer-info" id="viewer-info"></div>
  </div>
  <div class="ctx-menu" id="ctx-menu" hidden role="menu"></div>
  <div class="toast" id="toast" hidden role="status"></div>

  <script type="module" src="./assets/studio.js?v=2026111622"></script>
</body>
</html>
