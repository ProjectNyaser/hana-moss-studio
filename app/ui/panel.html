<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>苔室</title>
  <script src="./assets/theme-boot.js"></script>
  <link rel="stylesheet" href="./assets/hana-theme.css">
  <style>
    /* 苔室侧栏：生成设置与运行状态都在这条侧栏里，页面那边只留画布与画廊。
       颜色只走 hana-theme.css 的 --ui-*（宿主主题变量），不另造一套。 */
    /* 界面图标：内联 SVG 符号，线宽与颜色都跟文字走。 */
    .ic {
      width: 13px;
      height: 13px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.8;
    }
    .pn-head .ic { color: var(--ui-accent); opacity: 1; }
    .pn-head-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .pn-fold > summary { display: flex; align-items: center; gap: 6px; }
    .btn .ic { width: 12px; height: 12px; opacity: 0.9; }
    .pn-icons { position: absolute; width: 0; height: 0; overflow: hidden; }

    html, body { height: 100%; }
    body { background: var(--ui-sidebar); overflow-x: hidden; }

    .pn {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 12px 14px;
      width: 100%;
      min-width: 0;
      min-height: 100%;
      max-width: 460px;
    }

    .pn-block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .pn > * { min-width: 0; }
    .pn-block + .pn-block { padding-top: 10px; border-top: 1px solid var(--ui-line); }

    .pn-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--ui-text-3);
      letter-spacing: 0.03em;
    }

    .pn-state { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ui-text-2); min-width: 0; }
    .pn-state-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 参数：两列在窄栏里会自动落成一列。minmax(0,…) 是必需的，否则数字输入框的
       min-content 宽度会把两列顶出侧栏。 */
    .pn-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .pn-grid > .field { min-width: 0; }
    .pn input, .pn select, .pn textarea { min-width: 0; max-width: 100%; }

    .pn-presets { display: flex; flex-wrap: wrap; gap: 4px; }

    /* 尺寸滑条：滑块里直接写像素量。原生 range 的 thumb 放不进文本，所以自己搭。 */
    .pn-slider {
      position: relative;
      height: 30px;
      margin: 2px 0 0;
      padding: 0 21px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .pn-slider-rail {
      position: relative;
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: var(--ui-overlay-strong);
    }
    .pn-slider-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 999px;
      background: var(--ui-accent);
    }
    .pn-slider-thumb {
      position: absolute;
      top: 50%;
      left: 21px;
      width: 42px;
      height: 24px;
      margin-left: -21px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: var(--ui-accent);
      color: var(--panel-card-bg);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 1px 4px var(--ui-overlay-strong);
      transition: background var(--ui-fast) var(--ui-ease);
    }
    .pn-slider:hover .pn-slider-thumb { background: var(--ui-accent-hover); }
    .pn-slider-thumb:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
    .pn-preset {
      padding: 2px 8px;
      border: 1px solid var(--ui-line);
      border-radius: 999px;
      background: transparent;
      color: var(--ui-text-2);
      font: inherit;
      font-size: 11px;
      line-height: 1.6;
      cursor: pointer;
    }
    .pn-preset:hover { border-color: var(--ui-text-3); color: var(--ui-text); }
    .pn-preset.on { border-color: var(--ui-accent); background: var(--ui-tint); color: var(--ui-accent); }

    .pn-row { display: flex; gap: 6px; }
    .pn-row > .btn { flex: none; }

    .pn-job { display: flex; flex-direction: column; gap: 5px; }
    .pn-job-prompt {
      font-size: 11.5px;
      color: var(--ui-text-2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pn-job-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 10.5px;
      color: var(--ui-text-3);
      font-variant-numeric: tabular-nums;
    }

    .pn-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .pn-list li { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--ui-text-2); min-width: 0; }
    .pn-list .idx { color: var(--ui-text-3); font-size: 10px; flex: none; font-variant-numeric: tabular-nums; }
    .pn-list .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pn-list .empty { color: var(--ui-text-3); font-size: 11px; }

    .pn-facts { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--ui-text-3); }
    .pn-facts .row-line { display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
    .pn-facts .row-line > span:first-child { flex: none; }
    .pn-facts .row-line span:last-child { min-width: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 折叠段：引擎与模型、要下什么 */
    .pn-fold { border-top: 1px solid var(--ui-line); }
    .pn-fold > summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      cursor: pointer;
      list-style: none;
      user-select: none;
      font-size: 11.5px;
      color: var(--ui-text-3);
      letter-spacing: 0.03em;
    }
    .pn-fold > summary::-webkit-details-marker { display: none; }
    .pn-fold > summary::after { content: "›"; margin-left: auto; flex: none; transition: transform 160ms var(--ui-ease); }
    .pn-fold[open] > summary::after { transform: rotate(90deg); }
    .pn-fold .fold-body { display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }

    .pn-foot { margin-top: auto; display: flex; justify-content: space-between; gap: 8px; font-size: 10.5px; color: var(--ui-text-3); }

    /* 安装：引擎与权重各一个按钮，进度条复用 .bar */
    .pn-install-actions { display: flex; gap: 6px; margin: 6px 0; }
    .pn-install-actions .btn { flex: 1; min-width: 0; justify-content: center; }
    /* 面板底色上 ghost 几乎没有边界，补一条描边才看得出是按钮 */
    .pn-install-actions .btn.ghost { border: 1px solid var(--ui-line); }
    .pn-install .bar { margin: 0 0 4px; }

    /* 高级：手填路径只是例外，默认收起来 */
    .pn-adv { border-top: 1px dashed var(--ui-line); padding-top: 6px; }
    .pn-adv > summary {
      cursor: pointer;
      list-style: none;
      font-size: 11px;
      color: var(--ui-text-3);
      user-select: none;
    }
    .pn-adv > summary::-webkit-details-marker { display: none; }
    .pn-adv > summary::after { content: "›"; margin-left: 5px; display: inline-block; transition: transform 160ms var(--ui-ease); }
    .pn-adv[open] > summary::after { transform: rotate(90deg); }
    .pn-adv .fold-body { padding-top: 6px; }

    @media (max-width: 280px) {
      .pn { padding: 8px 10px 12px; }
      .pn-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <svg class="pn-icons" aria-hidden="true">
    <symbol id="i-task" viewBox="0 0 16 16">
      <path d="M4.5 2.5h7M4.5 13.5h7M5.8 2.5c0 2.4 2.2 3.4 2.2 5.5s-2.2 3.1-2.2 5.5M10.2 2.5c0 2.4-2.2 3.4-2.2 5.5s2.2 3.1 2.2 5.5"/>
    </symbol>
    <symbol id="i-prompt" viewBox="0 0 16 16">
      <path d="M2.5 4.5h11M2.5 8h8M2.5 11.5h5.5"/>
    </symbol>
    <symbol id="i-sliders" viewBox="0 0 16 16">
      <path d="M2.5 5.2h11M2.5 10.8h11"/>
      <circle cx="5.8" cy="5.2" r="1.7"/>
      <circle cx="10.4" cy="10.8" r="1.7"/>
    </symbol>
    <symbol id="i-queue" viewBox="0 0 16 16">
      <path d="M6 4.5h7.5M6 8h7.5M6 11.5h7.5"/>
      <circle cx="2.8" cy="4.5" r="0.85"/>
      <circle cx="2.8" cy="8" r="0.85"/>
      <circle cx="2.8" cy="11.5" r="0.85"/>
    </symbol>
    <symbol id="i-engine" viewBox="0 0 16 16">
      <rect x="4.8" y="4.8" width="6.4" height="6.4" rx="1.2"/>
      <path d="M2 6.2h2.8M2 9.8h2.8M11.2 6.2H14M11.2 9.8H14M6.2 2v2.8M9.8 2v2.8M6.2 11.2V14M9.8 11.2V14"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 16 16">
      <path d="M8 2.5v7M5.2 7l2.8 2.8L10.8 7M3 13h10"/>
    </symbol>
    <symbol id="i-power" viewBox="0 0 16 16">
      <path d="M8 2.4v4.8"/>
      <path d="M5.1 4.3a4.6 4.6 0 1 0 5.8 0"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 16 16">
      <path d="M8 2.4 9.3 6 13 7.4 9.3 8.8 8 12.4 6.7 8.8 3 7.4 6.7 6z"/>
    </symbol>
  </svg>

  <div class="pn" id="pn-root">
    <div class="pn-block">
      <div class="pn-state">
        <span class="dot" id="pn-dot"></span>
        <span class="pn-state-text" id="pn-state">读取状态…</span>
      </div>
      <p class="hint" id="pn-message" role="status"></p>
    </div>

    <div class="pn-block" id="pn-job-block" hidden>
      <div class="pn-head"><span class="pn-head-title"><svg class="ic"><use href="#i-task"/></svg>当前任务</span> <button class="btn ghost small" id="pn-cancel" type="button">取消</button></div>
      <div class="pn-job">
        <span class="pn-job-prompt" id="pn-job-prompt"></span>
        <div class="bar" id="pn-bar"><i></i></div>
        <div class="pn-job-meta">
          <span id="pn-job-stage"></span>
          <span id="pn-job-eta" class="mono"></span>
        </div>
      </div>
    </div>

    <div class="pn-block">
      <div class="pn-head"><span class="pn-head-title"><svg class="ic"><use href="#i-prompt"/></svg>提示词</span></div>
      <label class="field">
        <textarea id="pn-prompt" rows="4" placeholder="苔石上的一盏白兰花，晨雾，柔光，浅景深"></textarea>
      </label>
      <label class="field">
        <span class="label">反向</span>
        <textarea id="pn-negative" rows="2" placeholder="模糊，畸变，水印"></textarea>
      </label>
    </div>

    <div class="pn-block">
      <div class="pn-head"><span class="pn-head-title"><svg class="ic"><use href="#i-sliders"/></svg>生成参数</span></div>
      <div class="pn-slider" id="pn-ratio-slider">
        <div class="pn-slider-rail"><i class="pn-slider-fill" id="pn-ratio-fill"></i></div>
        <span class="pn-slider-thumb" id="pn-ratio-thumb" role="slider" tabindex="0"
              aria-label="画幅比例，中间为方形" aria-valuemin="-1" aria-valuemax="1">1:1</span>
      </div>
      <div class="pn-slider" id="pn-slider">
        <div class="pn-slider-rail"><i class="pn-slider-fill" id="pn-slider-fill"></i></div>
        <span class="pn-slider-thumb" id="pn-slider-thumb" role="slider" tabindex="0"
              aria-label="图像大小，百万像素" aria-valuemin="0.3" aria-valuemax="4.2">1.0</span>
      </div>
      <div class="pn-grid">
        <label class="field"><span class="label">宽</span><input id="pn-width" type="number" min="256" max="4096" step="16" value="768"></label>
        <label class="field"><span class="label">高</span><input id="pn-height" type="number" min="256" max="4096" step="16" value="768"></label>
        <label class="field"><span class="label">步数</span><input id="pn-steps" type="number" min="1" max="80" value="8"></label>
        <label class="field"><span class="label">CFG</span><input id="pn-cfg" type="number" min="0" max="20" step="0.5" value="3"></label>
      </div>
      <p class="hint" id="pn-size-note"></p>
      <div class="field">
        <span class="label">种子</span>
        <div class="pn-row">
          <input id="pn-seed" type="number" min="0" placeholder="留空随机">
          <button class="btn ghost small" id="pn-reroll" type="button" title="换成随机种子">随机</button>
        </div>
      </div>
      <div class="pn-grid">
        <label class="field"><span class="label">高清修正</span>
          <select id="pn-hires">
            <option value="0">关闭</option>
            <option value="1.5">1.5 倍</option>
            <option value="2">2 倍（4K）</option>
            <option value="3">3 倍</option>
          </select>
        </label>
        <label class="field"><span class="label">修正步数</span><input id="pn-hires-steps" type="number" min="0" max="80" value="0" placeholder="跟主步数"></label>
      </div>
      <button class="btn primary wide" id="pn-generate" type="button"><svg class="ic"><use href="#i-spark"/></svg>开始生成</button>
    </div>

    <div class="pn-block">
      <div class="pn-head"><span class="pn-head-title"><svg class="ic"><use href="#i-queue"/></svg>队列</span> <span class="mono" id="pn-queue-count"></span></div>
      <ul class="pn-list" id="pn-queue"></ul>
    </div>

    <details class="pn-fold" id="pn-fold-engine">
      <summary><svg class="ic"><use href="#i-engine"/></svg>引擎与模型</summary>
      <div class="fold-body">
        <div class="pn-install" id="pn-install">
          <div class="pn-install-actions">
            <button class="btn small" id="pn-install-engine" type="button">装引擎</button>
            <button class="btn ghost small" id="pn-install-weights" type="button">下权重</button>
            <button class="btn ghost small" id="pn-install-cancel" type="button" hidden>取消</button>
          </div>
          <div class="bar" id="pn-install-bar" hidden><i></i></div>
          <p class="hint" id="pn-install-message"></p>
        </div>
        <div class="pn-facts" id="pn-facts"></div>
        <p class="hint" id="pn-engine-detail"></p>
        <label class="field" id="pn-engine-pick" hidden>
          <span class="label">引擎版本</span>
          <select id="pn-engine-select"></select>
        </label>
        <details class="pn-adv" id="pn-fold-adv">
          <summary>自定义</summary>
          <div class="fold-body">
            <label class="field">
              <span class="label">引擎 CUDA 版本</span>
              <select id="pn-engine-cuda">
                <option value="auto">自动（按驱动判断）</option>
                <option value="cu13">CUDA 13</option>
                <option value="cu12">CUDA 12</option>
              </select>
            </label>
            <label class="field">
              <span class="label">moss-server 路径</span>
              <input id="pn-server-path" type="text" placeholder="一般不用填，点上面的「装引擎」">
            </label>
            <label class="field">
              <span class="label">模型目录（diffusers 根）</span>
              <input id="pn-model-path" type="text" placeholder="一般不用填，点上面的「下权重」">
            </label>
          </div>
        </details>
        <div class="pn-grid">
          <label class="field">
            <span class="label">显存策略</span>
            <select id="pn-memory-mode">
              <option value="min_memory">省显存</option>
              <option value="balanced">均衡</option>
              <option value="max_speed">速度优先</option>
            </select>
          </label>
          <label class="field">
            <span class="label">精度档</span>
            <select id="pn-tier">
              <option value="high">高精度</option>
              <option value="reference">参考档</option>
              <option value="turbo">INT4 Turbo</option>
            </select>
          </label>
        </div>
        <div class="pn-row">
          <button class="btn small" id="pn-engine" type="button"><svg class="ic"><use href="#i-power"/></svg>启动引擎</button>
          <button class="btn ghost small" id="pn-save" type="button">保存设置</button>
        </div>
      </div>
    </details>

    <details class="pn-fold" id="pn-fold-plan">
      <summary><svg class="ic"><use href="#i-download"/></svg>要下什么</summary>
      <div class="fold-body">
        <p class="hint" id="pn-plan-total"></p>
        <ul class="pn-list" id="pn-plan-list"></ul>
        <p class="hint" id="pn-engine-note"></p>
      </div>
    </details>

    <div class="pn-foot">
      <span id="pn-errors"></span>
      <span class="mono" id="pn-engine-version"></span>
    </div>
  </div>

  <script type="module" src="./assets/panel.js"></script>
</body>
</html>
